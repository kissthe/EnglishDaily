services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env}
      DATA_DIR: /app/data
    volumes:
      - english_data:/app/data
volumes:
  english_data:
    name: english_daily_data
